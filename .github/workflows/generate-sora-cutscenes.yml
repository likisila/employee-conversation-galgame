name: Generate Sora cutscenes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate story-accurate Sora cutscenes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate_sora_cutscenes.mjs
      - name: Commit generated MP4 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cutscenes/*.mp4 public/assets/cutscenes/sora-generation-report.json
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore: replace cutscenes with Sora renders"
            git push
          fi
