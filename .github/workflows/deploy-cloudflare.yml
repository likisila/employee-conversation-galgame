name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允許一個部署同時進行；新的 push 會取代進行中的舊部署。
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 直接沿用 scripts/deploy-cloudflare.mjs（npm run deploy:cf），
      # 與本機部署走同一條路徑，避免 CI 與本機用兩套不同的 wrangler 呼叫方式。
      - run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
