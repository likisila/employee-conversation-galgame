name: Render cutscenes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-cutscenes.yml'
      - 'scripts/render_cutscenes.py'
      - 'property/cutscenes.json'
      - 'property/characters.json'
      - 'property/images.json'
      - 'property/scenes/**'
      - 'public/assets/backgrounds/**'
      - 'public/assets/characters/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow

      - name: Render MP4 cutscenes
        run: python scripts/render_cutscenes.py

      - name: Commit generated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cutscenes
          if git diff --cached --quiet; then
            echo "Cutscenes are already up to date."
          else
            git commit -m "chore: render cutscene videos"
            git push
          fi
